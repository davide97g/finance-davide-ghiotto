# Dokploy variant of the stack for the homelab mini PC.
#
# Differences from docker-compose.yml (which stays the local/dev one):
#  - nothing is published on a host port (8080 is taken by qbittorrent there);
#    Traefik reaches `web` over the shared `dokploy-network` instead
#  - the Traefik labels are left to Dokploy: it injects them from the domain
#    configured on the application, so declaring our own would create a second
#    router on the same host rule
#
# Required environment (set on the Dokploy application):
#   APP_DOMAIN, POSTGRES_PASSWORD, SESSION_SECRET
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    volumes:
      - finance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # The browser only ever talks to `web`, which proxies /api same-origin.
      CORS_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - default

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    networks:
      - dokploy-network
      - default

  backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - finance_pgbackups:/backups
    networks:
      - default

networks:
  dokploy-network:
    external: true

volumes:
  finance_pgdata:
  finance_pgbackups:
