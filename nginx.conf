server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build output: safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell and the service worker must never be served stale, or a deploy
    # never reaches an installed PWA.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Docker's embedded DNS, consulted at request time. Resolving through a
    # variable keeps nginx from refusing to start when the API container is not
    # up yet (every container starts at once after a reboot) and from pinning a
    # stale container IP after a redeploy.
    #
    # The upstream is `finance-api`, never the service name. This container is
    # on Dokploy's shared network so Traefik can reach it, and on that network
    # other projects' api containers publish the alias `api` as well: Docker's
    # DNS then hands back someone else's container, which refuses the
    # connection, and every /api request 502s while both stacks are healthy.
    # The alias is declared on the api service in both compose files.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API: no CORS, and the session cookie stays first-party.
    location /api/ {
        set $api_upstream http://finance-api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The change feed is a long-lived SSE stream: no buffering, no timeout.
    # 502 here while the API restarts is expected; EventSource reconnects.
    location = /api/events {
        set $api_events_upstream http://finance-api:3000;
        proxy_pass $api_events_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # SPA fallback, matching the Firebase Hosting rewrite.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
